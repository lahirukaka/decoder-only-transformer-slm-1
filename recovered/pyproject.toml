[project]
name = "transformer-decoder-slm"
version = "0.1.0"
description = "Small decoder-only Transformer language model scaffold for learning PyTorch internals."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.1",
    "numpy>=2.4.6",
    "tokenizers>=0.22.1",
    "torch==2.11.0",
    "uvicorn>=0.35.0",
]

[project.scripts]
transformer-decoder-slm = "transformer_decoder_slm.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
